# Produkcija: Postgres, Redis, Backend, Frontend
# Pokretanje: docker compose -f docker-compose.prod.yml up -d --build
# Zaustavljanje: docker compose -f docker-compose.prod.yml down

services:
  postgres:
    image: postgres:16-alpine
    container_name: programai_postgres
    environment:
      POSTGRES_DB: programai
      POSTGRES_USER: programai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-programai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U programai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: programai_redis
    restart: unless-stopped

  backend:
    build:
      context: ./programai-crm/backend
      dockerfile: Dockerfile
    container_name: programai_backend
    environment:
      DATABASE_URL: postgresql://programai:${POSTGRES_PASSWORD:-programai}@postgres:5432/programai
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./programai-frontend
      dockerfile: Dockerfile
      args:
        # Na produkciji postavi na pravi URL API-ja (npr. https://api.tvojdomen.rs)
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    container_name: programai_frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  pgdata:
